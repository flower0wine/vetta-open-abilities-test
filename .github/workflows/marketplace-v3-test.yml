name: Marketplace v3 test release

on:
  push:
    branches: [refa/marketplace-v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-v3-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test plugin packages
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/marketplace-plugin-paths
          const manifest = require("./.vetta/marketplace.json");
          const plugins = manifest.abilities.flatMap((ability) =>
            ability.type === "plugin"
              ? [ability]
              : ability.type === "bundle"
                ? ability.config.members.filter((member) => member.type === "plugin" && member.source)
                : [],
          );
          for (const path of new Set(plugins.map((plugin) => plugin.source.path))) {
            console.log(path);
          }
          NODE
          while IFS= read -r path; do
            (cd "$path" && npm ci)
            if [ -f "$path/service/package-lock.json" ]; then
              (cd "$path/service" && npm ci)
            fi
            (cd "$path" && npm run check --if-present && npm test --if-present && npm run build)
          done < /tmp/marketplace-plugin-paths

      - name: Create deterministic plugin archives
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/marketplace-plugin-releases
          const manifest = require("./.vetta/marketplace.json");
          const plugins = manifest.abilities.flatMap((ability) =>
            ability.type === "plugin"
              ? [ability]
              : ability.type === "bundle"
                ? ability.config.members.filter((member) => member.type === "plugin" && member.source)
                : [],
          );
          for (const plugin of plugins) console.log(plugin.slug, plugin.releases.at(-1).minAppVersion);
          NODE
          while read -r slug app_version; do
            python3 scripts/stage-plugin-release.py "$slug" --min-app-version "$app_version"
          done < /tmp/marketplace-plugin-releases

      - name: Verify the catalog and archive digest
        run: node scripts/verify-v3-release.mjs

      - name: Save the verified archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-v3-plugin-archives
          path: .release-artifacts/*.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish the immutable test prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/marketplace-plugin-versions
          const manifest = require("./.vetta/marketplace.json");
          const plugins = manifest.abilities.flatMap((ability) =>
            ability.type === "plugin"
              ? [ability]
              : ability.type === "bundle"
                ? ability.config.members.filter((member) => member.type === "plugin" && member.source)
                : [],
          );
          for (const plugin of plugins) console.log(plugin.slug, plugin.releases.at(-1).version);
          NODE
          while read -r slug version; do
            tag="plugin-$slug-$version"
            asset=".release-artifacts/$slug-$version.zip"
            expected="$(sha256sum "$asset" | cut -d' ' -f1)"
            existing_dir="/tmp/existing-release-$slug-$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              mkdir -p "$existing_dir"
              gh release download "$tag" --pattern "$(basename "$asset")" --dir "$existing_dir"
              actual="$(sha256sum "$existing_dir/$(basename "$asset")" | cut -d' ' -f1)"
              test "$actual" = "$expected"
            else
              gh release create "$tag" "$asset" \
                --target "$GITHUB_SHA" \
                --title "Plugin test: $slug $version" \
                --notes "CI-built prerelease used to verify the Vetta marketplace v3 installation path." \
                --prerelease \
                --latest=false
            fi
          done < /tmp/marketplace-plugin-versions

      - name: Verify the published asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/marketplace-published-releases
          const manifest = require("./.vetta/marketplace.json");
          const plugins = manifest.abilities.flatMap((ability) =>
            ability.type === "plugin"
              ? [ability]
              : ability.type === "bundle"
                ? ability.config.members.filter((member) => member.type === "plugin" && member.source)
                : [],
          );
          for (const plugin of plugins) {
            const release = plugin.releases.at(-1);
            console.log(plugin.slug, release.version, release.artifact.sha256);
          }
          NODE
          while read -r slug version sha256; do
            published_dir="/tmp/published-release-$slug-$version"
            mkdir -p "$published_dir"
            gh release download "plugin-$slug-$version" \
              --pattern "$slug-$version.zip" \
              --dir "$published_dir"
            echo "$sha256  $published_dir/$slug-$version.zip" | sha256sum --check --strict
          done < /tmp/marketplace-published-releases
